name: Deploy to AKS

on:
  push:
    branches:
      - main
    paths:
      - 'platform/apps/**'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        uses: azure/aks-set-context@v3
        with:
          resource-group: shared-tf-rg
          cluster-name: shared-aks

      - name: Apply cluster-wide resources
        run: kubectl apply -f platform/apps/cluster-issuer.yaml

      - name: Deploy demo-app
        run: kubectl apply -f platform/apps/demo-app/
