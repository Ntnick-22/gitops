replicaCount: 1

image:
  repository: nginx
  tag: "1.24-alpine"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false       # workers run in the background, no HTTP exposure needed
  className: traefik
  host: ""
  clusterIssuer: letsencrypt-prod
  tlsSecretName: worker-tls

configmap:
  data:
    APP_ENV: production
    APP_NAME: worker

hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  cpuUtilization: 80
