replicaCount: 1

image:
  repository: sharedaksnick.azurecr.io/backend
  tag: "v1.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: traefik
  host: backend.nt-nick.link
  clusterIssuer: letsencrypt-prod
  tlsSecretName: backend-tls

configmap:
  data:
    APP_ENV: production
    APP_NAME: backend

hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  cpuUtilization: 70
