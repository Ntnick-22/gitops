replicaCount: 1

image:
  repository: sharedaksnick.azurecr.io/backend
  tag: "v1.0.1"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: traefik
  host: ""
  clusterIssuer: letsencrypt-prod
  tlsSecretName: backend-uat-tls

configmap:
  data:
    APP_ENV: uat
    APP_NAME: backend

hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 2
  cpuUtilization: 70
