replicaCount: 1

image:
  repository: nginxdemos/hello
  tag: "0.3"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: traefik
  host: frontend.nt-nick.link
  clusterIssuer: letsencrypt-prod
  tlsSecretName: frontend-tls

configmap:
  data:
    APP_ENV: production
    APP_NAME: frontend

hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  cpuUtilization: 70
