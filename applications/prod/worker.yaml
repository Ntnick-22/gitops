apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: worker-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Ntnick-22/gitops.git
    targetRevision: main
    path: helm-charts/worker
    helm:
      valueFiles:
        - values-prod.yaml
  destination:
    name: in-cluster
    namespace: prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
